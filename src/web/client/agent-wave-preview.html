<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoMoreIDE · Agent wave loader preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f6;
        --panel: #ffffff;
        --panel-soft: #fafaf9;
        --fg: #181716;
        --muted: #77736f;
        --border: #dedbd7;
        --button: #181716;
        --button-fg: #ffffff;
        --jump-shadow: rgb(0 0 0 / 0.18);
        --wave-duration: 1.6s;
        --wave-step: 176ms;
      }

      .dark {
        color-scheme: dark;
        --bg: #100f0e;
        --panel: #181614;
        --panel-soft: #12110f;
        --fg: #f3f2f1;
        --muted: #a6a19d;
        --border: #34312e;
        --button: #f3f2f1;
        --button-fg: #181614;
        --jump-shadow: rgb(0 0 0 / 0.55);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input { font: inherit; }

      .page {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }

      .preview-shell {
        width: min(920px, 100%);
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 18px 55px rgb(0 0 0 / 12%);
      }

      .toolbar {
        display: flex;
        min-height: 45px;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding: 7px 10px;
      }

      .title { margin-right: auto; font-size: 12px; font-weight: 650; }
      .subtitle { color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }

      .control {
        min-height: 29px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: transparent;
        color: var(--fg);
        padding: 0 9px;
        cursor: pointer;
      }

      .control:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
      .control:focus-visible { outline: 2px solid #3aa78d; outline-offset: 2px; }

      .speed {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 10px;
      }

      .speed input { width: 82px; accent-color: #3aa78d; }

      .stage {
        display: grid;
        min-height: 500px;
        place-items: center;
        padding: 36px;
        background: var(--panel-soft);
      }

      .composer { width: min(720px, 100%); }
      h1 { margin: 0 0 16px; text-align: center; font-size: 19px; font-weight: 560; letter-spacing: -0.02em; }

      .agent-wave {
        display: flex;
        min-height: 30px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 11px;
      }

      .marks { position: relative; display: flex; height: 28px; align-items: end; gap: 8px; }

      .mark {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        animation: agent-wave var(--wave-duration) ease-in-out infinite;
        animation-delay: calc(var(--index) * var(--wave-step));
        will-change: transform, opacity;
      }

      .mark svg, .mark img { width: 16px; height: 16px; overflow: visible; object-fit: contain; }
      .claude { color: #d97757; }
      .codex { color: var(--fg); }
      .gemini { color: #4d8df7; }
      .deepseek { color: #5786fe; }
      .kimi { color: var(--fg); }

      @keyframes agent-wave {
        0%, 5%, 16%, 100% { filter: drop-shadow(0 1px 1px var(--jump-shadow)); opacity: 0.45; transform: translateY(0) scale(0.92); }
        9% { filter: drop-shadow(0 5px 3px var(--jump-shadow)); opacity: 1; transform: translateY(-6px) scale(1); }
      }

      @keyframes agent-wave-signal {
        0%, 4% { opacity: 0; offset-distance: 0%; }
        9%, 11% { opacity: 1; offset-distance: 0%; }
        20%, 23% { opacity: 1; offset-distance: 18.754%; }
        31%, 34% { opacity: 1; offset-distance: 37.512%; }
        42%, 45% { opacity: 1; offset-distance: 56.266%; }
        53%, 56% { opacity: 1; offset-distance: 75.02%; }
        65% { opacity: 0.15; offset-distance: 100%; }
        69%, 100% { opacity: 0; offset-distance: 100%; }
      }

      @keyframes agent-wave-tail {
        0%, 11%, 20%, 23%, 31%, 34%, 42%, 45%, 53%, 56%, 65%, 100% { opacity: 0; transform: translateY(-50%) scaleX(0.15); }
        13%, 18%, 25%, 29%, 36%, 40%, 47%, 51%, 58%, 63% { opacity: 0.8; transform: translateY(-50%) scaleX(1); }
      }

      .signal {
        position: absolute;
        z-index: 1;
        top: -0.5px;
        left: 10px;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
        color: var(--muted);
        filter: drop-shadow(0 0 1px currentColor);
        animation: agent-wave-signal var(--wave-duration) cubic-bezier(0.22, 0.8, 0.36, 1) infinite;
        offset-anchor: 50% 50%;
        offset-path: path("M 0 0 Q 14 -30 28 0 Q 42 -30 56 0 Q 70 -30 84 0 Q 98 -30 112 0 Q 133 -40 154 -12");
        offset-rotate: auto;
        will-change: offset-distance, opacity;
      }

      .signal::before {
        position: absolute;
        top: 50%;
        right: 1px;
        width: 8px;
        height: 1.5px;
        border-radius: 50%;
        background: linear-gradient(90deg, transparent, currentColor);
        content: "";
        transform-origin: right center;
        animation: agent-wave-tail var(--wave-duration) linear infinite;
      }

      .paused .mark { animation-play-state: paused; }
      .paused .signal { animation-play-state: paused; }
      .paused .signal::before { animation-play-state: paused; }

      .prompt {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
      }

      .prompt-copy { height: 92px; padding: 15px; color: var(--muted); font-size: 14px; }
      .prompt-bar { display: flex; height: 40px; align-items: center; gap: 8px; border-top: 1px solid var(--border); padding: 0 9px; }
      .provider { display: flex; align-items: center; gap: 6px; border-radius: 4px; background: color-mix(in srgb, var(--fg) 7%, transparent); padding: 5px 8px; font-size: 11px; }
      .provider svg { width: 13px; height: 13px; }
      .hint { margin-left: auto; color: var(--muted); font-size: 10px; }
      .send { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 6px; background: var(--button); color: var(--button-fg); }

      .note { margin: 10px 0 0; text-align: center; color: var(--muted); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }

      @media (max-width: 640px) {
        .page, .stage { padding: 14px; }
        .toolbar { flex-wrap: wrap; }
        .title { width: 100%; }
        .stage { min-height: 430px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; opacity: 0.72; transform: none; }
        .signal { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="preview-shell" aria-labelledby="preview-title">
        <header class="toolbar">
          <div class="title" id="preview-title">Agent wave loader <span class="subtitle">dynamic HTML preview</span></div>
          <label class="speed">Speed <input aria-label="Animation speed" id="speed" max="2.4" min="0.8" step="0.05" type="range" value="1.6" /><span id="speed-value">1.60s</span></label>
          <button class="control" id="pause" type="button">Pause</button>
          <button class="control" id="theme" type="button">Light mode</button>
        </header>

        <div class="stage" id="stage">
          <div class="composer">
            <h1>What are we building today?</h1>
            <div class="agent-wave" role="status" aria-label="Starting Codex">
              <span class="marks" aria-hidden="true">
                <span class="signal"></span>
                <span class="mark claude" style="--index: 0">
                  <img alt="" src="./src/assets/clawd.svg" />

                </span>
                <span class="mark gemini" style="--index: 2">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.04 19.32Q12 21.51 12 24q0-2.49.93-4.68.96-2.19 2.58-3.81t3.81-2.55Q21.51 12 24 12q-2.49 0-4.68-.93a12.3 12.3 0 0 1-3.81-2.58 12.3 12.3 0 0 1-2.58-3.81Q12 2.49 12 0q0 2.49-.96 4.68-.93 2.19-2.55 3.81a12.3 12.3 0 0 1-3.81 2.58Q2.49 12 0 12q2.49 0 4.68.96 2.19.93 3.81 2.55t2.55 3.81"/></svg>
                </span>
                <span class="mark deepseek" style="--index: 3">

176.264.336.536.446.848.066.194-.02.353-.25.45"/></svg>
                </span>
                <span class="mark kimi" style="--index: 4">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="m1.053 16.91 9.538 2.55a21 20.981 0 0 0 .06 2.031l5.956 1.592a12 11.99 0 0 1-15.554-6.172m-1.02-5.79 11.352 3.035a21 20.981 0 0 0-.469 2.01l10.817 2.89a12 11.99 0 0 1-1.845 2.004L.658 15.918a12 11.99 0 0 1-.625-4.796m1.593-5.146L13.573 9.17a21 20.981 0 0 0-1.01 1.874l11.297 3.02a21 20.981 0 0 1-.67 2.362l-11.55-3.087L.125 10.26a12 11.99 0 0 1 1.499-4.285ZM6.067 1.58l11.285 3.016a21 20.981 0 0 0-1.688 1.719l7.824 2.091a21 20.981 0 0 1 .513 2.664L2.107 5.218a12 11.99 0 0 1 3.96-3.638M21.68 4.866 7.222 1.003A12 11.99 0 0 1 21.68 4.866"/></svg>
                </span>
              </span>
              <span>Starting Codex…</span>
            </div>

            <div class="prompt">
              <div class="prompt-copy">Describe the complete task…</div>
              <div class="prompt-bar">
                <span class="provider codex"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 10h6M10 7v6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>Codex</span>
                <span class="hint">Shift+Enter for newline</span>
                <button class="send" aria-label="Run agent task" type="button">↑</button>
              </div>
            </div>
            <p class="note">The production component automatically stops motion when reduced motion is enabled.</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const stage = document.querySelector("#stage");
      const pause = document.querySelector("#pause");
      const theme = document.querySelector("#theme");
      const speed = document.querySelector("#speed");
      const speedValue = document.querySelector("#speed-value");

      pause.addEventListener("click", () => {
        const paused = stage.classList.toggle("paused");
        pause.textContent = paused ? "Play" : "Pause";
      });

      theme.addEventListener("click", () => {
        const dark = root.classList.toggle("dark");
        theme.textContent = dark ? "Light mode" : "Dark mode";
      });

      speed.addEventListener("input", () => {
        root.style.setProperty("--wave-duration", `${speed.value}s`);
        root.style.setProperty("--wave-step", `${Number(speed.value) * 0.11}s`);
        speedValue.textContent = `${Number(speed.value).toFixed(2)}s`;
      });
    </script>
  </body>
</html>
