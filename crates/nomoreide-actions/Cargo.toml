[package]
name = "nomoreide-actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
sqlx.workspace = true
serde_json.workspace = true
# The host actions post to the vendor through the same egress-bounded path
# the read half uses, so this crate needs the HTTP client and the encoder.
reqwest.workspace = true
urlencoding.workspace = true
nomoreide-core = { path = "../nomoreide-core" }

# Only the parity probe in `examples/` needs to print JSON; the crate itself
# does not serialise anything on its own.
[dev-dependencies]
serde_json.workspace = true
