[package]
name = "nomoreide-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The backbone of NoMoreIDE: service config, process supervision, logs, git, agents, databases and providers."
readme = "README.md"
# `include` rather than the default git-driven file list: `vendored/` is
# gitignored build output that `build.rs` compiles in, and cargo would
# otherwise leave it out of the package.
include = [
    "src/**/*",
    "build.rs",
    "vendored/**/*",
    "README.md",
    "Cargo.toml",
]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
futures-util.workspace = true
nomoreide-remote-protocol = { path = "../nomoreide-remote-protocol", version = "0.6.0" }
tar.workspace = true
regex.workspace = true
portable-pty.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sqlx.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
