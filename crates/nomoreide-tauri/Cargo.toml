[package]
name = "nomoreide-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The desktop app, not a library anyone installs from crates.io — and it
# would drag the whole Tauri toolchain in behind it.
publish = false

[lib]
name = "nomoreide_tauri"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
anyhow.workspace = true
nomoreide-core = { path = "../nomoreide-core", version = "0.13.0" }
nomoreide-daemon = { path = "../nomoreide-daemon", version = "0.13.0" }
nomoreide-daemon-client = { path = "../nomoreide-daemon-client", version = "0.13.0" }
reqwest.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
tokio.workspace = true
uuid.workspace = true
