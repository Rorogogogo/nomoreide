[package]
name = "nomoreide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "NoMoreIDE: an AI-native service workbench with a CLI, a TUI, a web dashboard and an MCP server."
readme = "README.md"

# No `[[bin]]`: the binary lives in the `nomoreide` crate, which is the name
# people install. Two crates emitting `nomoreide` collide in `target/`, and
# cargo warns that the collision may become a hard error.

[dependencies]
nomoreide-core = { path = "../nomoreide-core", version = "0.7.1" }
nomoreide-daemon = { path = "../nomoreide-daemon", version = "0.7.1" }
nomoreide-daemon-client = { path = "../nomoreide-daemon-client", version = "0.7.1" }
nomoreide-mcp = { path = "../nomoreide-mcp", version = "0.7.1" }
anyhow.workspace = true
crossterm.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
