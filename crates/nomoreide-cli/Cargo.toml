[package]
name = "nomoreide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "NoMoreIDE: an AI-native service workbench with a CLI, a TUI, a web dashboard and an MCP server."
readme = "README.md"

[[bin]]
name = "nomoreide"
path = "src/main.rs"

[dependencies]
nomoreide-core = { path = "../nomoreide-core", version = "0.3.0" }
nomoreide-daemon = { path = "../nomoreide-daemon", version = "0.3.0" }
nomoreide-daemon-client = { path = "../nomoreide-daemon-client", version = "0.3.0" }
nomoreide-mcp = { path = "../nomoreide-mcp", version = "0.3.0" }
anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The TUI puts the terminal into raw mode and puts it back on the way out.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
