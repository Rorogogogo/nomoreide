[package]
name = "nomoreide-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "NoMoreIDE: an AI-native service workbench with a CLI, a TUI, a web dashboard and an MCP server."
readme = "README.md"

# No `[[bin]]`: the binary lives in the `nomoreide` crate, which is the name
# people install. Two crates emitting `nomoreide` collide in `target/`, and
# cargo warns that the collision may become a hard error.

[dependencies]
nomoreide-core = { path = "../nomoreide-core", version = "1.0.0" }
nomoreide-daemon = { path = "../nomoreide-daemon", version = "1.0.0" }
nomoreide-daemon-client = { path = "../nomoreide-daemon-client", version = "1.0.0" }
nomoreide-mcp = { path = "../nomoreide-mcp", version = "1.0.0" }
anyhow.workspace = true
crossterm.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# `nomoreide menubar`: the menu-bar app and its window. macOS-only, and pinned
# to the versions Tauri already resolves in Cargo.lock so nothing new compiles.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
tao = "0.35"
tray-icon = "0.23"
wry = "0.55"
