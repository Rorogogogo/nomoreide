[package]
name = "nomoreide-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The NoMoreIDE daemon: the local HTTP server, its route registry, and the embedded web dashboard."
readme = "README.md"
# `include` rather than the default git-driven file list, because the vendored
# dashboard is gitignored build output and cargo would otherwise leave it out —
# publishing a daemon whose UI is missing. Setting `include` stops cargo
# consulting git at all, so everything the package needs is named here.
include = [
    "src/**/*",
    "build.rs",
    "web-client/**/*",
    "README.md",
    "Cargo.toml",
]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
chrono.workspace = true
futures-util.workspace = true
nomoreide-actions = { path = "../nomoreide-actions", version = "0.7.1" }
nomoreide-core = { path = "../nomoreide-core", version = "0.7.1" }
nomoreide-daemon-client = { path = "../nomoreide-daemon-client", version = "0.7.1" }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
tower.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
reqwest.workspace = true
tokio-tungstenite = "0.24"
