name: Release (Version Bump & Tag)

# Releasing is deliberate, not a side effect of merging. Merges accumulate on
# main — tested by ci.yml on every push — and a release is cut by running this
# workflow. Tagging v<version> here is what triggers desktop-release.yml.
#
# This no longer publishes to npm. It cannot: the package now carries the
# compiled Rust binary for four platforms, and none of them exist yet at this
# point — the tag pushed below is what starts the workflow that builds them.
# `cli-release.yml` publishes npm from the same tag once all four are built and
# attached, so npm can never name a version whose binaries are missing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Bump version and tag
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/Rorogogogo/nomoreide.git"
          npm version "${BUMP:-patch}" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          node scripts/sync-version.mjs "$NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          git add package.json package-lock.json apps/dashboard/package.json crates/nomoreide-tauri/tauri.conf.json Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push
          git push --tags
