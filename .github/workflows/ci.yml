name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is supported; DB Peek's SQLite needs >=22.5 (built-in
        # node:sqlite) and degrades gracefully on 20 — pg/mysql work everywhere.
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  # `npm run build` runs vite (which does not typecheck) plus tsc over the
  # server only, so client type errors and lint violations used to reach main
  # unnoticed. These run once rather than across the Node matrix.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check web client
        run: npm run typecheck --workspace @nomoreide/dashboard
      - name: Type check website
        run: npm run typecheck --workspace @nomoreide/website
      - name: Build website
        run: npm run build --workspace @nomoreide/website
      - run: npm run lint

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  desktop-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: npm ci
      - run: npm run version:check
      - run: npm run rust:dependency-check
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The Phase 2 exit gate: run the TypeScript reference and the native
      # binary side by side and compare what each reports through MCP. It needs
      # the binary on disk, which `cargo test` only builds incidentally, and the
      # reference runs from source via tsx (`npm ci` above), against the client
      # `npm run build` already produced.
      - run: cargo build --workspace
      - name: MCP runtime parity
        run: npm run mcp:runtime-parity -- ./target/debug/nomoreide
