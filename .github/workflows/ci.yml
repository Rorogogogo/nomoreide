name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is supported; DB Peek's SQLite needs >=22.5 (built-in
        # node:sqlite) and degrades gracefully on 20 — pg/mysql work everywhere.
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  # `npm run build` runs vite (which does not typecheck) plus tsc over the
  # server only, so client type errors and lint violations used to reach main
  # unnoticed. These run once rather than across the Node matrix.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check web client
        run: npm run typecheck --workspace @nomoreide/dashboard
      - name: Type check website
        run: npm run typecheck --workspace @nomoreide/website
      - name: Build website
        run: npm run build --workspace @nomoreide/website
      - run: npm run lint

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  desktop-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - run: npm ci
      - run: npm run version:check
      - run: npm run rust:dependency-check
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The parity gates: each one runs the TypeScript reference and the native
      # binary side by side and diffs what the two answer. They need the binary
      # on disk, which `cargo test` only builds incidentally, and the reference
      # runs from source via tsx (`npm ci` above), against the client
      # `npm run build` already produced.
      - run: cargo build --workspace
      # Phase 6's exit gate, kept executable rather than asserted once: the
      # product must run with node, npm, npx and tsx absent from PATH. Node
      # stays a build-time dependency for the frontend assets `npm run build`
      # produced above, which is what the daemon serves.
      - name: Runs with no Node.js on PATH
        run: ./scripts/check-no-node.sh
      # Two gates reach neither MCP nor HTTP — GitActions is a dashboard and
      # desktop surface, and the daemon's `/api/hosts/*` routes are Phase 8 —
      # so they drive their crate's own probe example instead of a tool.
      # Phase 7's exit gate: it builds a release the way `cli-release.yml` does,
      # serves it over `file://`, and drives the real `install.sh` through a
      # fresh install, an upgrade, a downgrade, a corrupted download, the PATH
      # diagnostics and an uninstall — then runs all three MCP setup flows off
      # the installed binary with node absent from PATH.
      - name: install.sh installs, upgrades and uninstalls
        run: ./scripts/check-install.sh
      - name: Build the parity probe examples
        run: |
          cargo build --example git-actions-probe -p nomoreide-actions
          cargo build --example vultr-probe -p nomoreide-actions
      # One step for every gate, discovered from `scripts/check-*-parity.ts`
      # rather than listed here. This job used to name each gate in its own
      # step, which meant it silently ran 13 of the 65 that existed: a gate is
      # only evidence if it runs, and one nobody remembered to add ran nowhere.
      # A new gate is now covered the moment its file is committed.
      # Replayed, not live — and the reason is the runner, not the port.
      #
      # A live gate starts the TypeScript reference beside the native binary.
      # On a hosted macOS runner the reference cannot open a PTY at all:
      # node-pty answers `posix_spawnp failed.` for `/bin/bash`, `ssh` and
      # every other shell, so four terminal gates report a difference that is
      # entirely the reference's inability to run here. The native side spawns
      # them fine. Diffing against a runtime that is broken in this environment
      # measures the environment.
      #
      # Replay has no such problem: the reference's answers come from
      # `test/expectations/`, recorded where both runtimes work, and the
      # candidate still runs for real against them. The reference is pointed at
      # a path that cannot exist, so a gate that still reaches for TypeScript
      # dies naming itself — which is also what says the suite survives
      # deleting `src/`, Phase 8's whole point. Live remains the default for
      # developers, and is what `npm run parity` does with no flag.
      #
      # `--allow-skips` covers a gate that needs something this runner does not
      # have; `check-mcp-terminal-parity` drives a docker-compose terminal and
      # there is no Docker here.
      - name: Parity gates (replayed, without the TypeScript reference)
        run: npm run parity -- ./target/debug/nomoreide --replay --allow-skips
