<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/nomoreide-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nomoreide — AI-native terminal workbench</title>
    <meta name="description" content="An AI-native terminal workbench for services, Git review, logs, and MCP workflows." />
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem("nomoreide-theme-choice");
          const theme = stored === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
