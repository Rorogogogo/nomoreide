[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"
# Shared across every published crate, so a release cannot ship one of them
# pointing somewhere else. `description` and `readme` stay per-crate: they are
# the two fields crates.io shows, and a shared one would describe six crates
# identically.
repository = "https://github.com/Rorogogogo/nomoreide"
homepage = "https://www.nomoreide.com"
keywords = ["mcp", "ai-agents", "devtools", "cli", "developer-tools"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# A profile exports as a `.tar.gz`, which is the interchange format the
# reference already writes — so these read and write someone else's archives,
# not just our own.
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
regex = "1"
# rustls rather than the default native-tls, which on Linux means a dynamic
# link to `libssl.so.3`. A bare `debian:12` does not ship it, so the binary
# would not start at all there — caught by the `glibc floor` job, which runs
# the release archive in the base image with nothing installed. The three
# non-TLS defaults (`charset`, `http2`, `system-proxy`) are re-listed by hand
# because `default-features = false` drops them too. `-native-roots` keeps the
# OS trust store, so a corporate CA still works the way it did under
# native-tls; the bundled-roots variant would have quietly stopped honouring
# one. Dropping OpenSSL is also what a musl build was waiting on.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` because a JSON object's keys are sometimes the user's own
# data — the MCP servers in a profile, say — and the reference preserves the
# order they were written in. Without this, parsing a request would sort them
# before any tool saw them, and the order could never be recovered.
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "json"] }
subtle = "2.6"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
# The relay connector's WebSocket client. rustls with the OS trust store, to
# match `reqwest` above — nothing in this workspace links OpenSSL, and a bare
# `debian:12` does not ship libssl.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
thiserror = "2"
# `preserve_order` because an agent config reports its MCP servers in file
# order, which a sorted table would lose.
toml = { version = "0.8", features = ["preserve_order"] }
# Edits Codex's config in place, so its comments and layout survive a write.
toml_edit = "0.20"
# `util` for `ServiceExt::oneshot`: the relay dispatcher calls the daemon's
# own router in-process rather than over a loopback socket.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
